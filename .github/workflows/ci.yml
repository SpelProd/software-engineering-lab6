name: Automated CMake C# Build

on: [push]

jobs:
  build-project:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание исходного кода
        uses: actions/checkout@v4

      - name: Установка .NET SDK и инструментов
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Настройка конфигурации CMake
        run: cmake -B build -S .

      - name: Компиляция программного средства
        run: cmake --build build --configuration Release
