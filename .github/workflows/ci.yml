name: Automated .NET Build

on: [push] # Пайплайн срабатывает при каждом git push

jobs:
  build-project:
    runs-on: ubuntu-latest # Используем чистую ОС Linux в облаке
    steps:
      - name: Скачивание исходного кода
        uses: actions/checkout@v4

      - name: Установка компилятора и утилит (.NET SDK)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Указываем актуальную версию платформы .NET

      - name: Восстановление зависимостей (утилит)
        run: dotnet restore

      - name: Компиляция программного средства
        run: dotnet build --no-restore --configuration Release
