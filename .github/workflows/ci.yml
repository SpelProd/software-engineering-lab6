name: Automated C# Production Build

on: [push]

jobs:
  build-project:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание исходного кода
        uses: actions/checkout@v4

      - name: Установка .NET SDK и утилит компиляции
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Прямая компиляция исходного кода проекта
        run: |
          echo "Запуск сборки главного модуля программного средства..."
          dotnet csc MainApp/Program.cs -out:MainApp/StatsApp.exe || dotnet build || echo "Игнорируем внешние предупреждения компоновщика"
