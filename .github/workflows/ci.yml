name: Automated .NET Build

on: [push]

jobs:
  build-project:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание исходного кода
        uses: actions/checkout@v4

      - name: Установка компилятора и утилит (.NET SDK)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Поиск и компиляция всех проектов
        run: |
          echo "Ищем файлы проектов..."
          find . -name "*.csproj"
          
          echo "Запуск компиляции..."
          for file in $(find . -name "*.csproj"); do
            echo "Собираем проект: $file"
            dotnet build "$file" --configuration Release
          done
