name: Automated .NET Build

on: [push]

jobs:
  build-project:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание исходного кода
        uses: actions/checkout@v4

      - name: Установка компилятора и утилит (.NET SDK)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Восстановление зависимостей (утилит)
        run: dotnet restore MainApp/MainApp.csproj || dotnet restore StatsApp/StatsApp.csproj || dotnet restore

      - name: Компиляция программного средства
        run: dotnet build --configuration Release
